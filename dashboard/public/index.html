<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MQTT Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; font-size: 28px; }
    .cards { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; }
    .card { background: #1e293b; border-radius: 16px; padding: 30px 50px; text-align: center; }
    .card h2 { font-size: 14px; color: #94a3b8; margin-bottom: 10px; }
    .card p { font-size: 48px; font-weight: bold; }
    .temp { color: #f97316; }
    .hum { color: #38bdf8; }
    .chart-box { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 30px; }
    .led-box { background: #1e293b; border-radius: 16px; padding: 30px; text-align: center; }
    .led-box h2 { margin-bottom: 20px; color: #94a3b8; }
    .btn { padding: 14px 40px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer; margin: 0 10px; font-weight: bold; }
    .btn-on { background: #22c55e; color: white; }
    .btn-off { background: #ef4444; color: white; }
    .status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>🌡️ ESP32 MQTT Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h2>Temperature</h2>
      <p class="temp" id="temp">--°C</p>
    </div>
    <div class="card">
      <h2>Humidity</h2>
      <p class="hum" id="hum">--%</p>
    </div>
  </div>

  <div class="chart-box">
    <canvas id="myChart" height="100"></canvas>
  </div>

  <div class="led-box">
    <h2>💡 LED Control</h2>
    <button class="btn btn-on" onclick="ledControl('ON')">ON</button>
    <button class="btn btn-off" onclick="ledControl('OFF')">OFF</button>
    <p class="status" id="ledStatus">Status: --</p>
  </div>

  <script>
    const socket = io();
    const labels = [];
    const tempData = [];
    const humData = [];

    const ctx = document.getElementById('myChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Temperature °C', data: tempData, borderColor: '#f97316', tension: 0.4, fill: false },
          { label: 'Humidity %', data: humData, borderColor: '#38bdf8', tension: 0.4, fill: false }
        ]
      },
      options: {
        plugins: { legend: { labels: { color: 'white' } } },
        scales: {
          x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
          y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
        }
      }
    });

    socket.on('sensorData', (data) => {
      document.getElementById('temp').textContent = data.temperature.toFixed(1) + '°C';
      document.getElementById('hum').textContent = data.humidity.toFixed(1) + '%';

      const time = new Date().toLocaleTimeString();
      labels.push(time);
      tempData.push(data.temperature);
      humData.push(data.humidity);

      if (labels.length > 15) {
        labels.shift(); tempData.shift(); humData.shift();
      }
      chart.update();
    });

    function ledControl(command) {
      socket.emit('ledControl', command);
      document.getElementById('ledStatus').textContent = 'Status: LED ' + command;
    }
  </script>
</body>
</html>
